name: Forja del Kernel NetHunter (Domz Studio)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Extraer Código Fuente
      uses: actions/checkout@v3

    - name: 2. Preparar Entorno de Compilación (Clang)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: 3. Compilar Núcleo Táctico
      run: |
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        # Localización automática del mapa de hardware (fajita/sdm845)
        CONFIG_FILE=$(ls arch/arm64/configs/ | grep -E 'fajita|sdm845' | head -n 1)
        make O=out $CONFIG_FILE
        make O=out -j$(nproc)

    - name: 4. Empaquetar Ojiva (AnyKernel3)
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
        # Ajuste de tolerancia dimensional para OnePlus 6T
        sed -i 's/device.name1=maguro/device.name1=fajita/g' AnyKernel/anykernel.sh
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || cp out/arch/arm64/boot/Image AnyKernel/
        cd AnyKernel
        zip -r9 ../Kernel-NetHunter-Fajita.zip *

    - name: 5. Subir Munición a la Nube
      uses: actions/upload-artifact@v3
      with:
        name: Kernel-NetHunter-Fajita
        path: Kernel-NetHunter-Fajita.zip
